<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="0 0 700 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0.5 L5.5,3 L0,5.5 Z" fill="#4a3da8"/>
    </marker>
  </defs>
  <rect width="700" height="700" fill="#ffffff"/>

  <!-- ===================== TR formula ===================== -->
  <text x="40" y="40" font-size="20" font-weight="bold" fill="#2c3e50">True Range (TR) de una vela = el mayor de:</text>
  <rect x="40" y="54" width="620" height="118" rx="12" fill="#e3e5f5" stroke="#7d83c4" stroke-width="1.8"/>
  <text x="70" y="92" font-size="19" fill="#2a2a45">TR = max( máximo − mínimo,</text>
  <text x="170" y="122" font-size="19" fill="#2a2a45">|máximo − cierre anterior|,</text>
  <text x="170" y="152" font-size="19" fill="#2a2a45">|mínimo − cierre anterior| )</text>

  <!-- ===================== candles → ATR ===================== -->
  <text x="40" y="212" font-size="18" font-weight="bold" fill="#34495e">Promedio del TR de las últimas 14 velas:</text>

  <!-- candles (colored: green bullish, red bearish) -->
  <g stroke-width="2.5">
    <!-- v1 bullish -->
    <line x1="80" y1="248" x2="80" y2="338" stroke="#1e7d4f"/><rect x="66" y="270" width="28" height="48" fill="#27ae60" stroke="#1e7d4f"/>
    <!-- v2 bearish -->
    <line x1="170" y1="236" x2="170" y2="340" stroke="#a93226"/><rect x="156" y="258" width="28" height="60" fill="#e05a47" stroke="#a93226"/>
    <!-- v3 bullish -->
    <line x1="260" y1="276" x2="260" y2="352" stroke="#1e7d4f"/><rect x="246" y="296" width="28" height="38" fill="#27ae60" stroke="#1e7d4f"/>
    <!-- v14 bearish -->
    <line x1="370" y1="224" x2="370" y2="340" stroke="#a93226"/><rect x="356" y="246" width="28" height="66" fill="#e05a47" stroke="#a93226"/>
  </g>
  <text x="315" y="312" font-size="22" fill="#566573">…</text>

  <!-- candle labels -->
  <g font-size="14" fill="#5d6d7e" text-anchor="middle">
    <text x="80" y="372">vela 1</text>
    <text x="170" y="372">vela 2</text>
    <text x="260" y="372">vela 3</text>
    <text x="370" y="372">vela 14</text>
  </g>

  <!-- arrow to ATR -->
  <text x="455" y="272" font-size="14" fill="#4a3da8" text-anchor="middle" font-weight="bold">promedio</text>
  <line x1="440" y1="295" x2="490" y2="295" stroke="#4a3da8" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="500" y="258" width="160" height="74" rx="12" fill="#d6d9f0" stroke="#4a3da8" stroke-width="2"/>
  <text x="580" y="290" font-size="22" font-weight="bold" fill="#2a2a45" text-anchor="middle">ATR</text>
  <text x="580" y="316" font-size="14" fill="#3a3a5a" text-anchor="middle">promedio(TR₁…₁₄)</text>

  <text x="40" y="404" font-size="15" fill="#5d6d7e">Termómetro de volatilidad: mercado tranquilo → ATR bajo · violento → ATR alto</text>

  <!-- ===================== uso del ATR: TP / SL ===================== -->
  <line x1="40" y1="424" x2="660" y2="424" stroke="#d8d8d8" stroke-width="1.5"/>
  <text x="40" y="456" font-size="18" font-weight="bold" fill="#34495e">Uso en la simulación (operación LONG):</text>

  <!-- price axis with TP / entry / SL -->
  <!-- TP line (green) -->
  <rect x="60" y="486" width="420" height="34" rx="6" fill="#d4efdf" stroke="#27ae60" stroke-width="1.8"/>
  <text x="80" y="508" font-size="17" font-weight="bold" fill="#1e7d4f">TP = entrada + 1.5 × ATR</text>
  <text x="468" y="508" font-size="14" fill="#1e7d4f" text-anchor="end">ganancia</text>

  <!-- entry line (neutral) -->
  <rect x="60" y="528" width="420" height="34" rx="6" fill="#e3e5f5" stroke="#7d83c4" stroke-width="1.8"/>
  <text x="80" y="550" font-size="17" font-weight="bold" fill="#2a2a45">entrada</text>
  <text x="468" y="550" font-size="14" fill="#5d6d7e" text-anchor="end">precio actual</text>

  <!-- SL line (red) -->
  <rect x="60" y="570" width="420" height="34" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.8"/>
  <text x="80" y="592" font-size="17" font-weight="bold" fill="#922b21">SL = entrada − 1.0 × ATR</text>
  <text x="468" y="592" font-size="14" fill="#922b21" text-anchor="end">pérdida</text>

  <!-- brace annotations on the right -->
  <line x1="500" y1="503" x2="500" y2="545" stroke="#27ae60" stroke-width="2.5"/>
  <text x="512" y="522" font-size="14" fill="#1e7d4f">1.5 ATR</text>
  <line x1="500" y1="545" x2="500" y2="587" stroke="#c0392b" stroke-width="2.5"/>
  <text x="512" y="568" font-size="14" fill="#922b21">1.0 ATR</text>

  <text x="40" y="644" font-size="15" fill="#5d6d7e">Relación riesgo-recompensa 1.5 : 1. Los niveles se adaptan a la volatilidad:</text>
  <text x="40" y="666" font-size="15" fill="#5d6d7e">se ensanchan si el ATR es alto, se estrechan si es bajo (SHORT es el inverso).</text>
</svg>
