<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <!-- elegant open-chevron arrowheads -->
    <marker id="ah" viewBox="0 0 12 12" refX="9.5" refY="6" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#5B6B7B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ahDash" viewBox="0 0 12 12" refX="9.5" refY="6" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#6D4AA8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="ppShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#16191F" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="660" fill="#FFFFFF"/>

  <!-- title -->
  <text x="640" y="40" font-size="22" font-weight="bold" text-anchor="middle" fill="#16191F">C&#243;mo opera hoy el sistema en producci&#243;n</text>
  <text x="640" y="63" font-size="13" text-anchor="middle" fill="#5B6B7B">El componente de IA es un grafo de estados <tspan font-weight="bold">LangGraph</tspan> que orquesta tres nodos; el razonamiento lo aporta el LLM <tspan font-weight="bold">Qwen 2.5 14B (zero-shot)</tspan>, invocado desde los nodos</text>

  <!-- stage captions -->
  <g font-size="12.5" font-weight="bold" text-anchor="middle">
    <rect x="30" y="82" width="176" height="28" rx="14" fill="#EDEFF1"/>
    <text x="118" y="101" fill="#54616C">Mercado &#183; datos + &#243;rdenes</text>
    <rect x="247" y="82" width="236" height="28" rx="14" fill="#EDEFF1"/>
    <text x="365" y="101" fill="#54616C">Filtra + Quant Score (0&#8211;10)</text>
    <rect x="769" y="82" width="238" height="28" rx="14" fill="#EDEFF1"/>
    <text x="888" y="101" fill="#54616C">Genera + valida el setup (JSON)</text>
  </g>

  <!-- inter-stage flow arrows -->
  <line x1="204" y1="300" x2="236" y2="300" stroke="#5B6B7B" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="492" y1="300" x2="524" y2="300" stroke="#5B6B7B" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ============ BINANCE (datos + ejecucion) ============ -->
  <g>
    <rect x="34" y="120" width="168" height="340" rx="12" fill="#FFFBEA" stroke="#C9911A" stroke-width="2.2" filter="url(#ppShadow)"/>
    <!-- Binance logo: 5 diamonds, centered & contained -->
    <g fill="#F0B90B">
      <polygon points="118,156 127,165 118,174 109,165"/>
      <polygon points="118,196 127,205 118,214 109,205"/>
      <polygon points="98,176 107,185 98,194 89,185"/>
      <polygon points="138,176 147,185 138,194 129,185"/>
      <polygon points="118,176 127,185 118,194 109,185"/>
    </g>
    <text x="118" y="246" font-size="16" font-weight="bold" text-anchor="middle" fill="#16191F">Binance API</text>
    <text x="118" y="267" font-size="12.5" text-anchor="middle" fill="#54616C">Datos de mercado + ejecuci&#243;n</text>
    <line x1="52" y1="284" x2="184" y2="284" stroke="#F0DBA0" stroke-width="1.2"/>
    <text x="52" y="312" font-size="12" fill="#16191F">&#8226; Klines OHLCV (p&#250;blica)</text>
    <text x="52" y="338" font-size="12" fill="#16191F">&#8226; &#211;rdenes spot / futuros</text>
    <text x="52" y="364" font-size="12" fill="#16191F">&#8226; OCO: TP + SL</text>
    <text x="52" y="390" font-size="12" fill="#16191F">&#8226; Comisi&#243;n 0.1% / lado</text>
  </g>

  <!-- ============ QUANT SCANNER ============ -->
  <g>
    <rect x="240" y="120" width="250" height="340" rx="12" fill="#EAF1F8" stroke="#2563A8" stroke-width="2.2" filter="url(#ppShadow)"/>
    <text x="264" y="155" font-size="16.5" font-weight="bold" fill="#16191F">Quant Scanner</text>
    <text x="264" y="177" font-size="13" fill="#54616C">Backend FastAPI &#183; puerto 8001</text>
    <line x1="264" y1="195" x2="466" y2="195" stroke="#BBCBE0" stroke-width="1.2"/>
    <text x="264" y="222" font-size="13" fill="#16191F">&#8226; 20+ pares &#215; 7 timeframes</text>
    <text x="264" y="248" font-size="13" fill="#16191F">&#8226; Multihilo (ThreadPoolExecutor)</text>
    <text x="264" y="274" font-size="13" fill="#16191F">&#8226; Quant Score (0&#8211;10) &#183; 5 factores:</text>
    <text x="280" y="295" font-size="12" fill="#54616C">Volumen 30% &#183; ATR 25% &#183; RSI 20%</text>
    <text x="280" y="313" font-size="12" fill="#54616C">ADX 15% &#183; &#916;precio 10%</text>
    <text x="264" y="340" font-size="13" fill="#16191F">&#8226; Filtra pares &gt; $1M vol. 24h</text>
  </g>

  <!-- ============ AGENTE LANGGRAPH (grafo orquestador) ============ -->
  <g>
    <rect x="528" y="120" width="720" height="340" rx="12" fill="#F5F1FC" stroke="#6D4AA8" stroke-width="2.2" filter="url(#ppShadow)"/>
    <text x="552" y="153" font-size="17.5" font-weight="bold" fill="#16191F">Agente LangGraph</text>
    <text x="552" y="173" font-size="13" fill="#54616C">Grafo de estados (StateGraph) &#183; puerto 2024</text>
    <text x="552" y="193" font-size="11.5" fill="#54616C">El grafo define el flujo y el estado compartido entre nodos; cada nodo decide cu&#225;ndo delegar el razonamiento al LLM.</text>
    <line x1="552" y1="206" x2="1224" y2="206" stroke="#E0D6F2" stroke-width="1.2"/>

    <!-- node: Generator (LLM) -->
    <rect x="548" y="214" width="170" height="78" rx="8" fill="#FFFFFF" stroke="#6D4AA8" stroke-width="1.6"/>
    <text x="633" y="241" font-size="14" font-weight="bold" text-anchor="middle" fill="#16191F">Generator</text>
    <text x="633" y="260" font-size="11" text-anchor="middle" fill="#54616C">genera setup (JSON)</text>
    <text x="633" y="278" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#6D4AA8">LLM</text>

    <!-- generator -> evaluator -->
    <line x1="718" y1="248" x2="803" y2="248" stroke="#5B6B7B" stroke-width="1.8" marker-end="url(#ah)"/>

    <!-- node: Evaluator (deterministic, no LLM) -->
    <rect x="803" y="214" width="170" height="78" rx="8" fill="#EEF1F4" stroke="#5B6B7B" stroke-width="1.6"/>
    <text x="888" y="241" font-size="14" font-weight="bold" text-anchor="middle" fill="#16191F">Evaluator</text>
    <text x="888" y="260" font-size="11" text-anchor="middle" fill="#54616C">validaci&#243;n cuantitativa</text>
    <text x="888" y="278" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#54616C">determinista &#183; sin LLM</text>

    <!-- evaluator -> optimizer (conditional) -->
    <line x1="973" y1="248" x2="1058" y2="248" stroke="#6D4AA8" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#ahDash)"/>
    <text x="1015" y="240" font-size="10.5" font-style="italic" text-anchor="middle" fill="#6D4AA8">si hay issues</text>

    <!-- node: Optimizer (LLM, conditional) -->
    <rect x="1058" y="214" width="170" height="78" rx="8" fill="#FFFFFF" stroke="#6D4AA8" stroke-width="1.6"/>
    <text x="1143" y="241" font-size="14" font-weight="bold" text-anchor="middle" fill="#16191F">Optimizer</text>
    <text x="1143" y="260" font-size="11" text-anchor="middle" fill="#54616C">refina el setup</text>
    <text x="1143" y="278" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#6D4AA8">LLM &#183; condicional</text>

    <!-- connectors: only LLM nodes call the model -->
    <line x1="633" y1="292" x2="633" y2="336" stroke="#5B6B7B" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <line x1="1143" y1="292" x2="1143" y2="336" stroke="#5B6B7B" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <text x="888" y="319" font-size="11" font-style="italic" text-anchor="middle" fill="#54616C">los nodos LLM invocan el modelo&#160;&#160;(prompt &#8595; &#183; JSON &#8593;)</text>

    <!-- ENGINE: shared LLM (flagged zero-shot) -->
    <rect x="600" y="336" width="560" height="114" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2.2" stroke-dasharray="9,5"/>
    <text x="880" y="364" font-size="15.5" font-weight="bold" text-anchor="middle" fill="#16191F">Qwen 2.5 14B &#183; zero-shot</text>
    <text x="880" y="384" font-size="12" text-anchor="middle" fill="#54616C">v&#237;a Ollama (GPU &#183; Docker) &#8212; LLM_MODEL = qwen2.5:14b</text>
    <text x="880" y="409" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#B91C1C">Sin fine-tuning de dominio &#8594; no calibra bien TP / SL</text>
    <text x="880" y="430" font-size="11" font-style="italic" text-anchor="middle" fill="#7A2020">Componente que sustituye el fine-tuning QLoRA &#8212; ver Avance 7, &#167;3</text>
  </g>

  <!-- ============ RETURN LOOP: ejecucion -> Binance ============ -->
  <path d="M1240,460 V550 Q1240,562 1228,562 H130 Q118,562 118,550 V464"
        fill="none" stroke="#5B6B7B" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="479" y="551" width="400" height="24" rx="6" fill="#FFFFFF"/>
  <text x="679" y="568" font-size="13" text-anchor="middle" fill="#232F3E">Ejecuci&#243;n &#8594; Binance: &#243;rdenes spot / futuros (OCO: TP + SL)</text>

  <!-- thesis note -->
  <text x="640" y="612" font-size="13.5" text-anchor="middle" fill="#7A2020" font-style="italic">El LLM zero-shot (Qwen 2.5 14B) es exactamente el componente que este proyecto sustituye mediante fine-tuning QLoRA.</text>
  <text x="640" y="632" font-size="13.5" text-anchor="middle" fill="#7A2020" font-style="italic">El modelo fine-tuneado supera al zero-shot en exactitud y calidad de las operaciones &#8212; ver Avance 7, &#167;3.</text>
</svg>
