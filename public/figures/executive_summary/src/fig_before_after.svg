<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <filter id="baShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#16191F" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1080" height="470" fill="#FFFFFF"/>

  <!-- ================= PANEL IZQUIERDO: EXACTITUD ================= -->
  <text x="290" y="46" font-size="15" font-weight="bold" text-anchor="middle" fill="#16191F">Exactitud direccional</text>

  <!-- axis -->
  <line x1="120" y1="100" x2="120" y2="390" stroke="#C4CDD5" stroke-width="1.5"/>
  <line x1="120" y1="390" x2="500" y2="390" stroke="#C4CDD5" stroke-width="1.5"/>
  <!-- gridlines 0/50/100 -->
  <g font-size="10" fill="#8A949C" text-anchor="end">
    <line x1="120" y1="390" x2="500" y2="390" stroke="#EAEDEF"/>
    <text x="112" y="394">0%</text>
    <line x1="120" y1="245" x2="500" y2="245" stroke="#EAEDEF"/>
    <text x="112" y="249">50%</text>
    <line x1="120" y1="100" x2="500" y2="100" stroke="#EAEDEF"/>
    <text x="112" y="104">100%</text>
  </g>

  <!-- bars: 0%=y390, 100%=y100 -> 290px=100% -->
  <!-- zero-shot 56.49% -> h=163.8 -> top y=226.2 -->
  <rect x="190" y="226" width="100" height="164" rx="3" fill="#9E2A2B" filter="url(#baShadow)"/>
  <text x="240" y="216" font-size="14" font-weight="bold" text-anchor="middle" fill="#9E2A2B">56.49%</text>
  <text x="240" y="410" font-size="11.5" text-anchor="middle" fill="#16191F">Sin ajustar</text>
  <text x="240" y="425" font-size="10" text-anchor="middle" fill="#54616C">(zero-shot)</text>

  <!-- fine-tuned 84.13% -> h=244 -> top y=146 -->
  <rect x="340" y="146" width="100" height="244" rx="3" fill="#00796B" filter="url(#baShadow)"/>
  <text x="390" y="136" font-size="14" font-weight="bold" text-anchor="middle" fill="#00796B">84.13%</text>
  <text x="390" y="410" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#16191F">Fine-tuned</text>
  <text x="390" y="425" font-size="10" text-anchor="middle" fill="#54616C">(QLoRA, modelo final)</text>

  <!-- delta annotation -->
  <text x="315" y="458" font-size="11" text-anchor="middle" fill="#00796B" font-weight="bold">+27.6 pp &#183; McNemar p&#8776;0</text>

  <!-- divider -->
  <line x1="540" y1="80" x2="540" y2="430" stroke="#E3E7EA" stroke-width="1.2"/>

  <!-- ================= PANEL DERECHO: PROFIT FACTOR ================= -->
  <text x="800" y="46" font-size="15" font-weight="bold" text-anchor="middle" fill="#16191F">Factor de ganancia (profit factor)</text>

  <!-- axis: 0=y390, 3.0=y100 -> 290px=3.0 -> 96.67/unit -->
  <line x1="620" y1="100" x2="620" y2="390" stroke="#C4CDD5" stroke-width="1.5"/>
  <line x1="620" y1="390" x2="1000" y2="390" stroke="#C4CDD5" stroke-width="1.5"/>
  <g font-size="10" fill="#8A949C" text-anchor="end">
    <text x="612" y="394">0</text>
    <text x="612" y="297">1.0</text>
    <text x="612" y="201">2.0</text>
    <text x="612" y="104">3.0</text>
  </g>

  <!-- professional band 1.5-2.5 -> y from 390-145=245 to 390-241.7=148.3 -->
  <rect x="620" y="148" width="380" height="97" fill="#E6F4EA"/>
  <text x="992" y="164" font-size="10" text-anchor="end" fill="#1B8A4B" font-weight="bold">Rango profesional 1.5&#8211;2.5</text>

  <!-- break-even line PF=1.0 -> y=293.3 -->
  <line x1="620" y1="293" x2="1000" y2="293" stroke="#9E2A2B" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="628" y="286" font-size="10" fill="#9E2A2B" font-weight="bold">Equilibrio (PF = 1.0)</text>
  <text x="628" y="386" font-size="9.5" fill="#9E2A2B">debajo: pierde capital</text>

  <!-- zero-shot PF 0.70 -> h=67.7 -> top y=322.3 -->
  <rect x="690" y="322" width="100" height="68" rx="3" fill="#9E2A2B" filter="url(#baShadow)"/>
  <text x="740" y="312" font-size="14" font-weight="bold" text-anchor="middle" fill="#9E2A2B">0.70</text>
  <text x="740" y="410" font-size="11.5" text-anchor="middle" fill="#16191F">Sin ajustar</text>

  <!-- fine-tuned PF 2.09 -> h=202 -> top y=188 -->
  <rect x="840" y="188" width="100" height="202" rx="3" fill="#00796B" filter="url(#baShadow)"/>
  <text x="890" y="178" font-size="14" font-weight="bold" text-anchor="middle" fill="#00796B">2.09</text>
  <text x="890" y="410" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#16191F">Fine-tuned</text>

  <text x="815" y="458" font-size="11" text-anchor="middle" fill="#00796B" font-weight="bold">De destruir capital a viabilidad operativa</text>
</svg>
