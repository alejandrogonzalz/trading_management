<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 1400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ahV" viewBox="0 0 12 12" refX="9.5" refY="6" markerWidth="9.5" markerHeight="9.5" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#5B6B7B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ahDashV" viewBox="0 0 12 12" refX="9.5" refY="6" markerWidth="9.5" markerHeight="9.5" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#6D4AA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="ppShadowV" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#16191F" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1150" height="1400" fill="#FFFFFF"/>

  <!-- title -->
  <text x="575" y="46" font-size="34" font-weight="bold" text-anchor="middle" fill="#16191F">C&#243;mo opera hoy el sistema en producci&#243;n</text>
  <text x="575" y="80" font-size="19" text-anchor="middle" fill="#5B6B7B">El componente de IA es un grafo de estados <tspan font-weight="bold">LangGraph</tspan> que orquesta tres nodos;</text>
  <text x="575" y="104" font-size="19" text-anchor="middle" fill="#5B6B7B">el razonamiento lo aporta el LLM <tspan font-weight="bold">Qwen 2.5 14B (zero-shot)</tspan>, invocado desde los nodos</text>

  <!-- ============ RETURN LOOP (left margin, runs the full height) ============ -->
  <line x1="85" y1="1296" x2="85" y2="150" stroke="#5B6B7B" stroke-width="2.6" marker-end="url(#ahV)"/>
  <text x="56" y="723" font-size="18" text-anchor="middle" fill="#232F3E" transform="rotate(-90 56 723)">Ejecuci&#243;n &#8594; Binance: &#243;rdenes spot / futuros (OCO: TP + SL)</text>

  <!-- ============ BOX 1: BINANCE (datos + ejecucion) ============ -->
  <g>
    <rect x="145" y="130" width="860" height="235" rx="14" fill="#FFFBEA" stroke="#C9911A" stroke-width="2.6" filter="url(#ppShadowV)"/>
    <!-- Binance logo: 5 diamonds -->
    <g fill="#F0B90B">
      <polygon points="245,160 261,176 245,192 229,176"/>
      <polygon points="245,228 261,244 245,260 229,244"/>
      <polygon points="211,194 227,210 211,226 195,210"/>
      <polygon points="279,194 295,210 279,226 263,210"/>
      <polygon points="245,194 261,210 245,226 229,210"/>
    </g>
    <text x="315" y="205" font-size="28" font-weight="bold" fill="#16191F">Binance API</text>
    <text x="315" y="232" font-size="18.5" fill="#54616C">Datos de mercado + ejecuci&#243;n</text>
    <line x1="185" y1="250" x2="965" y2="250" stroke="#F0DBA0" stroke-width="1.5"/>
    <text x="215" y="286" font-size="20" fill="#16191F">&#8226; Klines OHLCV (p&#250;blica)</text>
    <text x="620" y="286" font-size="20" fill="#16191F">&#8226; &#211;rdenes spot / futuros</text>
    <text x="215" y="323" font-size="20" fill="#16191F">&#8226; OCO: TP + SL</text>
    <text x="620" y="323" font-size="20" fill="#16191F">&#8226; Comisi&#243;n 0.1% / lado</text>
  </g>

  <!-- arrow: Binance -> Scanner -->
  <line x1="575" y1="365" x2="575" y2="409" stroke="#5B6B7B" stroke-width="2.6" marker-end="url(#ahV)"/>

  <!-- ============ BOX 2: QUANT SCANNER ============ -->
  <g>
    <rect x="145" y="409" width="860" height="245" rx="14" fill="#EAF1F8" stroke="#2563A8" stroke-width="2.6" filter="url(#ppShadowV)"/>
    <text x="185" y="461" font-size="28" font-weight="bold" fill="#16191F">Quant Scanner</text>
    <text x="185" y="487" font-size="18.5" fill="#54616C">Backend FastAPI &#183; puerto 8001</text>
    <line x1="185" y1="504" x2="965" y2="504" stroke="#BBCBE0" stroke-width="1.5"/>
    <text x="215" y="539" font-size="20" fill="#16191F">&#8226; 20+ pares &#215; 7 timeframes</text>
    <text x="215" y="572" font-size="20" fill="#16191F">&#8226; Multihilo (ThreadPoolExecutor)</text>
    <text x="215" y="605" font-size="20" fill="#16191F">&#8226; Filtra pares &gt; $1M vol. 24h</text>
    <text x="610" y="539" font-size="18" font-weight="bold" fill="#16191F">Quant Score (0&#8211;10) &#183; 5 factores:</text>
    <text x="610" y="564" font-size="18" fill="#54616C">Volumen 30% &#183; ATR 25% &#183; RSI 20%</text>
    <text x="610" y="589" font-size="18" fill="#54616C">ADX 15% &#183; &#916;precio 10%</text>
  </g>

  <!-- arrow: Scanner -> Agent -->
  <line x1="575" y1="654" x2="575" y2="698" stroke="#5B6B7B" stroke-width="2.6" marker-end="url(#ahV)"/>

  <!-- ============ BOX 3: AGENTE LANGGRAPH (grafo orquestador) ============ -->
  <g>
    <rect x="145" y="698" width="860" height="598" rx="14" fill="#F5F1FC" stroke="#6D4AA8" stroke-width="2.6" filter="url(#ppShadowV)"/>
    <text x="185" y="750" font-size="30" font-weight="bold" fill="#16191F">Agente LangGraph</text>
    <text x="185" y="779" font-size="19" fill="#54616C">Grafo de estados (StateGraph) &#183; puerto 2024</text>
    <text x="185" y="803" font-size="13.5" fill="#54616C">El grafo define el flujo y el estado compartido entre nodos; cada nodo decide cu&#225;ndo delegar el razonamiento al LLM.</text>
    <line x1="185" y1="818" x2="965" y2="818" stroke="#E0D6F2" stroke-width="1.5"/>

    <!-- node: Generator (LLM) -->
    <rect x="185" y="840" width="210" height="150" rx="11" fill="#FFFFFF" stroke="#6D4AA8" stroke-width="2.2"/>
    <text x="290" y="882" font-size="23" font-weight="bold" text-anchor="middle" fill="#16191F">Generator</text>
    <text x="290" y="910" font-size="15.5" text-anchor="middle" fill="#54616C">genera setup (JSON)</text>
    <text x="290" y="936" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#6D4AA8">LLM</text>

    <!-- generator -> evaluator -->
    <line x1="395" y1="875" x2="445" y2="875" stroke="#5B6B7B" stroke-width="2.4" marker-end="url(#ahV)"/>

    <!-- node: Evaluator (deterministic, no LLM) -->
    <rect x="445" y="840" width="210" height="150" rx="11" fill="#EEF1F4" stroke="#5B6B7B" stroke-width="2.2"/>
    <text x="550" y="882" font-size="23" font-weight="bold" text-anchor="middle" fill="#16191F">Evaluator</text>
    <text x="550" y="910" font-size="15.5" text-anchor="middle" fill="#54616C">validaci&#243;n cuantitativa</text>
    <text x="550" y="936" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#54616C">determinista &#183; sin LLM</text>

    <!-- evaluator -> optimizer (conditional) -->
    <line x1="655" y1="875" x2="755" y2="875" stroke="#6D4AA8" stroke-width="2.4" stroke-dasharray="6,4" marker-end="url(#ahDashV)"/>
    <text x="705" y="860" font-size="13" font-style="italic" text-anchor="middle" fill="#6D4AA8">si hay issues</text>

    <!-- node: Optimizer (LLM, conditional) -->
    <rect x="755" y="840" width="210" height="150" rx="11" fill="#FFFFFF" stroke="#6D4AA8" stroke-width="2.2"/>
    <text x="860" y="882" font-size="23" font-weight="bold" text-anchor="middle" fill="#16191F">Optimizer</text>
    <text x="860" y="910" font-size="15.5" text-anchor="middle" fill="#54616C">refina el setup</text>
    <text x="860" y="936" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#6D4AA8">LLM &#183; condicional</text>

    <!-- connectors: only LLM nodes call the model -->
    <line x1="290" y1="990" x2="290" y2="1045" stroke="#5B6B7B" stroke-width="2.2" marker-start="url(#ahV)" marker-end="url(#ahV)"/>
    <line x1="860" y1="990" x2="860" y2="1045" stroke="#5B6B7B" stroke-width="2.2" marker-start="url(#ahV)" marker-end="url(#ahV)"/>
    <text x="575" y="1021" font-size="15.5" font-style="italic" text-anchor="middle" fill="#54616C">los nodos LLM invocan el modelo&#160;&#160;(prompt &#8595; &#183; JSON &#8593;)</text>

    <!-- ENGINE: shared LLM (flagged zero-shot) -->
    <rect x="185" y="1045" width="780" height="225" rx="14" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2.8" stroke-dasharray="9,5"/>
    <text x="575" y="1090" font-size="25" font-weight="bold" text-anchor="middle" fill="#16191F">Qwen 2.5 14B &#183; zero-shot</text>
    <text x="575" y="1120" font-size="18" text-anchor="middle" fill="#54616C">v&#237;a Ollama (GPU &#183; Docker) &#8212; LLM_MODEL = qwen2.5:14b</text>
    <text x="575" y="1157" font-size="21.5" font-weight="bold" text-anchor="middle" fill="#B91C1C">Sin fine-tuning de dominio &#8594; no calibra bien TP / SL</text>
    <text x="575" y="1195" font-size="15.5" font-style="italic" text-anchor="middle" fill="#7A2020">Componente que sustituye el fine-tuning QLoRA &#8212; ver Avance 7, &#167;3</text>
  </g>

  <!-- thesis note -->
  <text x="575" y="1344" font-size="18" text-anchor="middle" fill="#7A2020" font-style="italic">El LLM zero-shot (Qwen 2.5 14B) es exactamente el componente que este proyecto sustituye mediante fine-tuning QLoRA.</text>
  <text x="575" y="1370" font-size="18" text-anchor="middle" fill="#7A2020" font-style="italic">El modelo fine-tuneado supera al zero-shot en exactitud y calidad de las operaciones &#8212; ver Avance 7, &#167;3.</text>
</svg>
