<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="rmArrowV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#54616C"/>
    </marker>
    <filter id="rmShadowV" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#16191F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="1480" fill="#FFFFFF"/>

  <!-- vertical timeline -->
  <line x1="70" y1="45" x2="70" y2="1410" stroke="#C4CDD5" stroke-width="3.2" marker-end="url(#rmArrowV)"/>
  <circle cx="70" cy="45" r="11" fill="#00796B"/>
  <circle cx="70" cy="510" r="11" fill="#1E4C7C"/>
  <circle cx="70" cy="970" r="11" fill="#B7790A"/>

  <!-- timing chips -->
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="410" y="29" width="180" height="32" rx="16" fill="#E6F4F1"/>
    <text x="500" y="51" fill="#00796B">Semana 0</text>
    <rect x="402" y="494" width="196" height="32" rx="16" fill="#E7EEF6"/>
    <text x="500" y="516" fill="#1E4C7C">Semanas 1&#8211;4</text>
    <rect x="410" y="954" width="180" height="32" rx="16" fill="#FBF1DC"/>
    <text x="500" y="976" fill="#B7790A">Continuo</text>
  </g>

  <!-- ============ FASE 1 ============ -->
  <g>
    <rect x="140" y="80" width="720" height="380" rx="14" fill="#E6F4F1" stroke="#00796B" stroke-width="2.4" filter="url(#rmShadowV)"/>
    <text x="164" y="128" font-size="24" font-weight="bold" fill="#16191F">Fase 1 &#183; Activaci&#243;n</text>
    <line x1="156" y1="146" x2="844" y2="146" stroke="#B6DDD6" stroke-width="1.5"/>
    <text x="164" y="180" font-size="17" fill="#16191F">&#8226; Servir el modelo ajustado</text>
    <text x="180" y="202" font-size="14.5" fill="#54616C">(Together AI / Ollama)</text>
    <text x="164" y="236" font-size="17" fill="#16191F">&#8226; Conectarlo al agente</text>
    <text x="180" y="258" font-size="14.5" fill="#54616C">LangGraph existente</text>
    <text x="164" y="298" font-size="18" font-weight="bold" fill="#00796B">&#8226; Sin costo adicional</text>
    <text x="164" y="330" font-size="18" font-weight="bold" fill="#00796B">&#8226; Sin bloqueador t&#233;cnico</text>
    <text x="164" y="372" font-size="14" font-style="italic" fill="#54616C">Artefacto ya entrenado y</text>
    <text x="164" y="392" font-size="14" font-style="italic" fill="#54616C">versionado en S3 (DVC).</text>
  </g>

  <!-- ============ FASE 2 ============ -->
  <g>
    <rect x="140" y="540" width="720" height="380" rx="14" fill="#E7EEF6" stroke="#1E4C7C" stroke-width="2.4" filter="url(#rmShadowV)"/>
    <text x="164" y="588" font-size="24" font-weight="bold" fill="#16191F">Fase 2 &#183; Validaci&#243;n</text>
    <line x1="156" y1="606" x2="844" y2="606" stroke="#BBCBE0" stroke-width="1.5"/>
    <text x="164" y="640" font-size="17" fill="#16191F">&#8226; Paper trading en vivo</text>
    <text x="180" y="662" font-size="14.5" fill="#54616C">(sin capital real)</text>
    <text x="164" y="696" font-size="17" fill="#16191F">&#8226; Monitoreo de exactitud</text>
    <text x="180" y="718" font-size="14.5" fill="#54616C">rodante, 4 semanas</text>
    <text x="164" y="758" font-size="18" font-weight="bold" fill="#9E2A2B">&#8226; GATE obligatorio &#9733;</text>
    <text x="164" y="790" font-size="17" fill="#16191F">&#8226; Presupuesto $15&#8211;25/mes</text>
    <text x="164" y="832" font-size="14" font-style="italic" fill="#54616C">Cierra la brecha backtest</text>
    <text x="164" y="852" font-size="14" font-style="italic" fill="#54616C">hist&#243;rico &#8594; mercado actual.</text>
  </g>

  <!-- ============ FASE 3 ============ -->
  <g>
    <rect x="140" y="1000" width="720" height="380" rx="14" fill="#FBF1DC" stroke="#B7790A" stroke-width="2.4" filter="url(#rmShadowV)"/>
    <text x="164" y="1048" font-size="24" font-weight="bold" fill="#16191F">Fase 3 &#183; Maduraci&#243;n</text>
    <line x1="156" y1="1066" x2="844" y2="1066" stroke="#EAD7AC" stroke-width="1.5"/>
    <text x="164" y="1100" font-size="17" fill="#16191F">&#8226; Calibraci&#243;n de confianza</text>
    <text x="180" y="1122" font-size="14.5" fill="#54616C">(sizing tipo Kelly)</text>
    <text x="164" y="1156" font-size="17" fill="#16191F">&#8226; Validaci&#243;n walk-forward</text>
    <text x="164" y="1188" font-size="17" fill="#16191F">&#8226; Reentrenamiento ante drift</text>
    <text x="180" y="1208" font-size="14.5" fill="#54616C">(mitiga riesgo &#167;6)</text>
    <text x="164" y="1240" font-size="17" fill="#16191F">&#8226; Prueba en mercado bajista</text>
    <text x="164" y="1282" font-size="14" font-style="italic" fill="#54616C">No bloqueante para la</text>
    <text x="164" y="1302" font-size="14" font-style="italic" fill="#54616C">activaci&#243;n de la Fase 1.</text>
  </g>

  <text x="500" y="1438" font-size="16" text-anchor="middle" fill="#54616C" font-style="italic">Activaci&#243;n inmediata y sin costo; el compromiso de capital real</text>
  <text x="500" y="1460" font-size="16" text-anchor="middle" fill="#54616C" font-style="italic">queda detr&#225;s de un gate de validaci&#243;n en vivo de 4 semanas.</text>
</svg>
