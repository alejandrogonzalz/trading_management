<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="rmArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#54616C"/>
    </marker>
    <filter id="rmShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#16191F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1100" height="520" fill="#FFFFFF"/>

  <!-- timeline band -->
  <line x1="60" y1="128" x2="1050" y2="128" stroke="#C4CDD5" stroke-width="3" marker-end="url(#rmArrow)"/>

  <!-- timing chips -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="120" y="92" width="140" height="27" rx="13.5" fill="#E6F4F1"/>
    <text x="190" y="111" fill="#00796B">Semana 0</text>
    <rect x="468" y="92" width="164" height="27" rx="13.5" fill="#E7EEF6"/>
    <text x="550" y="111" fill="#1E4C7C">Semanas 1&#8211;4</text>
    <rect x="828" y="92" width="164" height="27" rx="13.5" fill="#FBF1DC"/>
    <text x="910" y="111" fill="#B7790A">Continuo</text>
  </g>

  <!-- nodes -->
  <circle cx="190" cy="128" r="10" fill="#00796B"/>
  <circle cx="550" cy="128" r="10" fill="#1E4C7C"/>
  <circle cx="910" cy="128" r="10" fill="#B7790A"/>

  <!-- ============ FASE 1 ============ -->
  <g>
    <rect x="40" y="165" width="300" height="305" rx="12" fill="#E6F4F1" stroke="#00796B" stroke-width="2.2" filter="url(#rmShadow)"/>
    <text x="64" y="200" font-size="17" font-weight="bold" fill="#16191F">Fase 1 &#183; Activaci&#243;n</text>
    <line x1="56" y1="214" x2="324" y2="214" stroke="#B6DDD6" stroke-width="1.4"/>
    <text x="64" y="246" font-size="14" fill="#16191F">&#8226; Servir el modelo ajustado</text>
    <text x="78" y="265" font-size="12.5" fill="#54616C">(Together AI / Ollama)</text>
    <text x="64" y="295" font-size="14" fill="#16191F">&#8226; Conectarlo al agente</text>
    <text x="78" y="314" font-size="12.5" fill="#54616C">LangGraph existente</text>
    <text x="64" y="344" font-size="14" font-weight="bold" fill="#00796B">&#8226; Sin costo adicional</text>
    <text x="64" y="373" font-size="14" font-weight="bold" fill="#00796B">&#8226; Sin bloqueador t&#233;cnico</text>
    <text x="64" y="412" font-size="12.5" font-style="italic" fill="#54616C">Artefacto ya entrenado y</text>
    <text x="64" y="432" font-size="12.5" font-style="italic" fill="#54616C">versionado en S3 (DVC).</text>
  </g>

  <!-- ============ FASE 2 ============ -->
  <g>
    <rect x="400" y="165" width="300" height="305" rx="12" fill="#E7EEF6" stroke="#1E4C7C" stroke-width="2.2" filter="url(#rmShadow)"/>
    <text x="424" y="200" font-size="17" font-weight="bold" fill="#16191F">Fase 2 &#183; Validaci&#243;n</text>
    <line x1="416" y1="214" x2="684" y2="214" stroke="#BBCBE0" stroke-width="1.4"/>
    <text x="424" y="246" font-size="14" fill="#16191F">&#8226; Paper trading en vivo</text>
    <text x="438" y="265" font-size="12.5" fill="#54616C">(sin capital real)</text>
    <text x="424" y="295" font-size="14" fill="#16191F">&#8226; Monitoreo de exactitud</text>
    <text x="438" y="314" font-size="12.5" fill="#54616C">rodante, 4 semanas</text>
    <text x="424" y="344" font-size="14" font-weight="bold" fill="#9E2A2B">&#8226; GATE obligatorio &#9733;</text>
    <text x="424" y="373" font-size="14" fill="#16191F">&#8226; Presupuesto $15&#8211;25/mes</text>
    <text x="424" y="412" font-size="12.5" font-style="italic" fill="#54616C">Cierra la brecha backtest</text>
    <text x="424" y="432" font-size="12.5" font-style="italic" fill="#54616C">hist&#243;rico &#8594; mercado actual.</text>
  </g>

  <!-- ============ FASE 3 ============ -->
  <g>
    <rect x="760" y="165" width="300" height="305" rx="12" fill="#FBF1DC" stroke="#B7790A" stroke-width="2.2" filter="url(#rmShadow)"/>
    <text x="784" y="200" font-size="17" font-weight="bold" fill="#16191F">Fase 3 &#183; Maduraci&#243;n</text>
    <line x1="776" y1="214" x2="1044" y2="214" stroke="#EAD7AC" stroke-width="1.4"/>
    <text x="784" y="246" font-size="14" fill="#16191F">&#8226; Calibraci&#243;n de confianza</text>
    <text x="798" y="265" font-size="12.5" fill="#54616C">(sizing tipo Kelly)</text>
    <text x="784" y="295" font-size="14" fill="#16191F">&#8226; Validaci&#243;n walk-forward</text>
    <text x="784" y="324" font-size="14" fill="#16191F">&#8226; Reentrenamiento ante drift</text>
    <text x="798" y="343" font-size="12.5" fill="#54616C">(mitiga riesgo &#167;6)</text>
    <text x="784" y="373" font-size="14" fill="#16191F">&#8226; Prueba en mercado bajista</text>
    <text x="784" y="412" font-size="12.5" font-style="italic" fill="#54616C">No bloqueante para la</text>
    <text x="784" y="432" font-size="12.5" font-style="italic" fill="#54616C">activaci&#243;n de la Fase 1.</text>
  </g>

  <!-- GATE diamond entre Fase 2 y Fase 3 -->
  <g>
    <path d="M730 290 L757 317 L730 344 L703 317 Z" fill="#FFFFFF" stroke="#9E2A2B" stroke-width="2"/>
    <text x="730" y="321" font-size="11" font-weight="bold" text-anchor="middle" fill="#9E2A2B">GATE</text>
    <text x="730" y="368" font-size="11" text-anchor="middle" fill="#9E2A2B">capital</text>
    <text x="730" y="382" font-size="11" text-anchor="middle" fill="#9E2A2B">real &#8594;</text>
  </g>

  <text x="550" y="500" font-size="13" text-anchor="middle" fill="#54616C" font-style="italic">Activaci&#243;n inmediata y sin costo; el compromiso de capital real queda detr&#225;s de un gate de validaci&#243;n en vivo de 4 semanas.</text>
</svg>
