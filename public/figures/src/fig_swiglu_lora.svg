<svg xmlns="http://www.w3.org/2000/svg" width="680" height="720" viewBox="0 0 680 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect width="680" height="720" fill="#ffffff"/>

  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">Bloque FFN SwiGLU de Qwen 2.5</text>
  <text x="340" y="58" text-anchor="middle" font-size="15" fill="#7f8c8d">cada proyección congelada lleva un adaptador LoRA entrenable</text>

  <!-- input -->
  <rect x="240" y="76" width="200" height="46" rx="9" fill="#d8dde6" stroke="#c4c9d4" stroke-width="1.5"/>
  <text x="340" y="104" text-anchor="middle" font-size="16" fill="#34495e">entrada x</text>

  <!-- split arrows -->
  <line x1="300" y1="122" x2="180" y2="150" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="380" y1="122" x2="500" y2="150" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ar)"/>

  <!-- gate path -->
  <rect x="40" y="152" width="270" height="74" rx="9" fill="#cfd6de" stroke="#aab2bd" stroke-width="1.4"/>
  <text x="175" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#566573">gate_proj</text>
  <text x="175" y="202" text-anchor="middle" font-size="14" fill="#7f8c8d">congelada · 4 bits NF4</text>
  <text x="175" y="220" text-anchor="middle" font-size="14" fill="#7f8c8d">→ dimensión intermedia</text>
  <rect x="232" y="232" width="120" height="40" rx="7" fill="#a9dec3" stroke="#1e8449" stroke-width="1.6"/>
  <text x="292" y="251" text-anchor="middle" font-size="14" font-weight="bold" fill="#0e6655">LoRA</text>
  <text x="292" y="266" text-anchor="middle" font-size="12.5" fill="#117a65">B·A gate</text>

  <!-- up path -->
  <rect x="370" y="152" width="270" height="74" rx="9" fill="#cfd6de" stroke="#aab2bd" stroke-width="1.4"/>
  <text x="505" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#566573">up_proj</text>
  <text x="505" y="202" text-anchor="middle" font-size="14" fill="#7f8c8d">congelada · 4 bits NF4</text>
  <text x="505" y="220" text-anchor="middle" font-size="14" fill="#7f8c8d">→ dimensión intermedia</text>
  <rect x="328" y="232" width="120" height="40" rx="7" fill="#a9dec3" stroke="#1e8449" stroke-width="1.6"/>
  <text x="388" y="251" text-anchor="middle" font-size="14" font-weight="bold" fill="#0e6655">LoRA</text>
  <text x="388" y="266" text-anchor="middle" font-size="12.5" fill="#117a65">B·A up</text>

  <!-- SiLU on gate path -->
  <line x1="175" y1="226" x2="175" y2="296" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="60" y="298" width="230" height="56" rx="9" fill="#f8dcc4" stroke="#e3b07a" stroke-width="1.5"/>
  <text x="175" y="322" text-anchor="middle" font-size="16" font-weight="bold" fill="#a04000">activación SiLU</text>
  <text x="175" y="342" text-anchor="middle" font-size="13.5" fill="#b9540a">no lineal · función fija heredada</text>

  <!-- up path straight down -->
  <line x1="505" y1="226" x2="505" y2="402" stroke="#8a8a8a" stroke-width="2"/>
  <!-- gate down to multiply -->
  <line x1="175" y1="354" x2="175" y2="402" stroke="#8a8a8a" stroke-width="2"/>

  <!-- multiply node -->
  <circle cx="340" cy="416" r="26" fill="#c5e0f0" stroke="#9cc6e0" stroke-width="1.8"/>
  <text x="340" y="425" text-anchor="middle" font-size="24" font-weight="bold" fill="#21618c">⊗</text>
  <line x1="175" y1="402" x2="316" y2="416" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="505" y1="402" x2="364" y2="416" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ar)"/>
  <text x="340" y="464" text-anchor="middle" font-size="14" fill="#7f8c8d">producto elemento a elemento</text>

  <!-- down_proj -->
  <line x1="340" y1="478" x2="340" y2="500" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="205" y="502" width="270" height="74" rx="9" fill="#cfd6de" stroke="#aab2bd" stroke-width="1.4"/>
  <text x="340" y="530" text-anchor="middle" font-size="16" font-weight="bold" fill="#566573">down_proj</text>
  <text x="340" y="552" text-anchor="middle" font-size="14" fill="#7f8c8d">congelada · 4 bits NF4</text>
  <text x="340" y="570" text-anchor="middle" font-size="14" fill="#7f8c8d">→ dimensión del modelo</text>
  <rect x="478" y="518" width="120" height="40" rx="7" fill="#a9dec3" stroke="#1e8449" stroke-width="1.6"/>
  <text x="538" y="537" text-anchor="middle" font-size="14" font-weight="bold" fill="#0e6655">LoRA</text>
  <text x="538" y="552" text-anchor="middle" font-size="12.5" fill="#117a65">B·A down</text>

  <!-- output -->
  <line x1="340" y1="576" x2="340" y2="598" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="240" y="600" width="200" height="44" rx="9" fill="#d8dde6" stroke="#c4c9d4" stroke-width="1.5"/>
  <text x="340" y="627" text-anchor="middle" font-size="16" fill="#34495e">salida del bloque</text>

  <!-- legend -->
  <rect x="60" y="668" width="22" height="16" rx="3" fill="#cfd6de" stroke="#aab2bd"/>
  <text x="90" y="681" font-size="14" fill="#566573">congelado (4 bits)</text>
  <rect x="330" y="668" width="22" height="16" rx="3" fill="#a9dec3" stroke="#1e8449"/>
  <text x="360" y="681" font-size="14" fill="#0e6655">adaptador LoRA entrenable (BF16)</text>
</svg>
