<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>

  <text x="490" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">Bloque feed-forward SwiGLU de Qwen 2.5 con inyección LoRA</text>
  <text x="490" y="58" text-anchor="middle" font-size="13" fill="#7f8c8d">cada proyección lineal congelada (4 bits) lleva acoplado un adaptador de bajo rango entrenable</text>

  <!-- input -->
  <rect x="410" y="80" width="160" height="40" rx="9" fill="#eef0f4" stroke="#c4c9d4" stroke-width="1.4"/>
  <text x="490" y="105" text-anchor="middle" font-size="13.5" fill="#34495e">entrada x (del bloque)</text>

  <!-- split arrows -->
  <line x1="460" y1="120" x2="250" y2="158" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="520" y1="120" x2="640" y2="158" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- gate path -->
  <rect x="120" y="160" width="240" height="58" rx="9" fill="#e5e8ec" stroke="#aab2bd" stroke-width="1.3"/>
  <text x="240" y="182" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#566573">gate_proj  (W_gate)</text>
  <text x="240" y="200" text-anchor="middle" font-size="11" fill="#7f8c8d">congelada · 4 bits NF4</text>
  <text x="240" y="213" text-anchor="middle" font-size="11" fill="#7f8c8d">proyecta a dimensión intermedia</text>
  <!-- LoRA on gate -->
  <rect x="368" y="168" width="74" height="42" rx="7" fill="#d4efdf" stroke="#1e8449" stroke-width="1.5"/>
  <text x="405" y="186" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0e6655">LoRA</text>
  <text x="405" y="200" text-anchor="middle" font-size="10" fill="#117a65">B·A gate</text>

  <!-- up path -->
  <rect x="620" y="160" width="240" height="58" rx="9" fill="#e5e8ec" stroke="#aab2bd" stroke-width="1.3"/>
  <text x="740" y="182" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#566573">up_proj  (W_up)</text>
  <text x="740" y="200" text-anchor="middle" font-size="11" fill="#7f8c8d">congelada · 4 bits NF4</text>
  <text x="740" y="213" text-anchor="middle" font-size="11" fill="#7f8c8d">proyecta a dimensión intermedia</text>
  <!-- LoRA on up -->
  <rect x="538" y="168" width="74" height="42" rx="7" fill="#d4efdf" stroke="#1e8449" stroke-width="1.5"/>
  <text x="575" y="186" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0e6655">LoRA</text>
  <text x="575" y="200" text-anchor="middle" font-size="10" fill="#117a65">B·A up</text>

  <!-- SiLU activation on gate path -->
  <line x1="240" y1="218" x2="240" y2="248" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="150" y="250" width="180" height="46" rx="9" fill="#fef4ec" stroke="#e3b07a" stroke-width="1.4"/>
  <text x="240" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04000">activación SiLU</text>
  <text x="240" y="287" text-anchor="middle" font-size="10.5" fill="#b9540a">no lineal · función fija heredada</text>

  <!-- up path straight down -->
  <line x1="740" y1="218" x2="740" y2="318" stroke="#8a8a8a" stroke-width="1.8"/>

  <!-- gate to multiply -->
  <line x1="240" y1="296" x2="240" y2="318" stroke="#8a8a8a" stroke-width="1.8"/>

  <!-- elementwise multiply node -->
  <circle cx="490" cy="332" r="22" fill="#eef6fb" stroke="#9cc6e0" stroke-width="1.6"/>
  <text x="490" y="339" text-anchor="middle" font-size="20" font-weight="bold" fill="#21618c">⊗</text>
  <line x1="240" y1="318" x2="468" y2="332" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="740" y1="318" x2="512" y2="332" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="490" y="372" text-anchor="middle" font-size="11" fill="#7f8c8d">producto elemento a elemento</text>

  <!-- down_proj -->
  <line x1="490" y1="386" x2="490" y2="406" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="360" y="408" width="240" height="58" rx="9" fill="#e5e8ec" stroke="#aab2bd" stroke-width="1.3"/>
  <text x="480" y="430" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#566573">down_proj  (W_down)</text>
  <text x="480" y="448" text-anchor="middle" font-size="11" fill="#7f8c8d">congelada · 4 bits NF4</text>
  <text x="480" y="461" text-anchor="middle" font-size="11" fill="#7f8c8d">regresa a la dimensión del modelo</text>
  <!-- LoRA on down -->
  <rect x="608" y="416" width="74" height="42" rx="7" fill="#d4efdf" stroke="#1e8449" stroke-width="1.5"/>
  <text x="645" y="434" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0e6655">LoRA</text>
  <text x="645" y="448" text-anchor="middle" font-size="10" fill="#117a65">B·A down</text>

  <!-- output -->
  <line x1="480" y1="466" x2="480" y2="488" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="400" y="490" width="160" height="38" rx="9" fill="#eef0f4" stroke="#c4c9d4" stroke-width="1.4"/>
  <text x="480" y="514" text-anchor="middle" font-size="13" fill="#34495e">salida del bloque FFN</text>

  <!-- legend -->
  <rect x="40" y="500" width="20" height="14" rx="3" fill="#e5e8ec" stroke="#aab2bd"/>
  <text x="66" y="511" font-size="11" fill="#566573">congelado (4 bits)</text>
  <rect x="40" y="522" width="20" height="14" rx="3" fill="#d4efdf" stroke="#1e8449"/>
  <text x="66" y="533" font-size="11" fill="#0e6655">adaptador LoRA entrenable (BF16)</text>
</svg>
