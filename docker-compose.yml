services:
  ollama:
    image: ollama/ollama:latest
    container_name: trading_management-ollama
    volumes:
      - ./volumes/ollama_models:/root/.ollama
    networks:
      - trading-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  backend:
    build: ./backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434 
      - DATABASE_URL=sqlite:////app/data/trading.db
      - LANGGRAPH_URL=http://langgraph:2024
      - PYTHONPATH=/app 
    depends_on:
      - ollama
    networks:
      - trading-network

  langgraph:
    build: ./langgraph
    container_name: trading_management-langgraph
    ports:
      - "2024:2024"
    environment:
      - BACKEND_URL=http://backend:8001
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_PROVIDER=ollama
      - LLM_MODEL=qwen2.5:14b
      - LLM_TEMPERATURE=0.1
    volumes:
      - ./langgraph:/app
    depends_on:
      - backend
      - ollama
    networks:
      - trading-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge
