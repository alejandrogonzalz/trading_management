services:
  mongodb:
    image: mongo:latest
    container_name: trading_management-db
    ports:
      - "27017:27017"
    volumes:
      - ./volumes/mongodb_data:/data/db
    networks:
      - trading-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: trading_management-ollama
    volumes:
      - ./volumes/ollama_models:/root/.ollama
    networks:
      - trading-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  backend:
    build: ./backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434 
      - MONGO_URL=mongodb://mongodb:27017
      - PYTHONPATH=/app 
    depends_on:
      - ollama
      - mongodb
    networks:
      - trading-network

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge
