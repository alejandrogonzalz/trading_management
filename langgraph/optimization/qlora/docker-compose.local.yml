## QLoRA Local Training — Docker Compose for Windows (WSL2 + NVIDIA Container Toolkit)
##
## Prerequisites (one-time):
##   1. Windows 11 with WSL2 enabled
##   2. Docker Desktop installed with "Use WSL 2 based engine" enabled
##   3. NVIDIA GPU driver installed on Windows (latest Game Ready or Studio driver)
##   4. NVIDIA Container Toolkit installed in WSL2:
##        wsl -d Ubuntu
##        curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
##        curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \
##          sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | \
##          sudo tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
##        sudo apt-get update && sudo apt-get install -y nvidia-container-toolkit
##        sudo nvidia-ctk runtime configure --runtime=docker
##        sudo systemctl restart docker
##   5. Verify GPU access: docker run --rm --gpus all nvidia/cuda:12.1.0-base-ubuntu22.04 nvidia-smi
##
## Usage:
##   cd langgraph
##
##   # Pull the image (~25 GB, one-time):
##   docker compose -f optimization/qlora/docker-compose.local.yml pull
##
##   # Run training (smoke test first, then full run):
##   docker compose -f optimization/qlora/docker-compose.local.yml up
##
##   # Run with custom flags (e.g. different config):
##   QLORA_FLAGS="--tag config2 --lr 0.00005 --rank 8 --epochs 3" \
##     docker compose -f optimization/qlora/docker-compose.local.yml up
##
##   # Interactive shell (for debugging):
##   docker compose -f optimization/qlora/docker-compose.local.yml run --rm qlora bash
##
##   # Monitor from another terminal:
##   docker compose -f optimization/qlora/docker-compose.local.yml logs -f

services:
  qlora:
    image: docker.io/unsloth/unsloth:latest
    container_name: qlora-local
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ../../:/workspace
    working_dir: /workspace
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OMP_NUM_THREADS=1
      - QLORA_FLAGS=${QLORA_FLAGS:-}
    command: >
      bash -c "
        echo '=== GPU Check ===' &&
        nvidia-smi &&
        echo '' &&
        python3 -c \"import torch; print(f'PyTorch {torch.__version__}, CUDA {torch.version.cuda}, GPU: {torch.cuda.get_device_name(0)}')\" &&
        python3 -c \"import flash_attn; print(f'FlashAttention-2: {flash_attn.__version__}')\" 2>/dev/null || echo 'FA2: not available' &&
        echo '' &&
        echo '=== Installing project deps ===' &&
        pip install -q scikit-learn xgboost httpx tqdm pyyaml matplotlib 2>/dev/null &&
        echo '' &&
        echo '=== Starting training ===' &&
        bash optimization/qlora/run_docker_local.sh $${QLORA_FLAGS}
      "
