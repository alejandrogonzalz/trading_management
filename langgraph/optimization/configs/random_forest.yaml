model: random_forest
search_method: random
cv_method: TimeSeriesSplit
cv_splits: 3
scoring: accuracy
n_random_iter: 80

param_grid:
  n_estimators: [200, 300, 500]
  max_depth: [4, 6, 8, 10]         # round 2: capped at 10 to fight overfitting
  min_samples_split: [2, 5, 10]
  min_samples_leaf: [10, 20, 50]   # round 2: raised floor — round 1 overfitting gap 0.203
  max_features: ["sqrt", "log2"]

fixed_params:
  random_state: 42
  n_jobs: -1
