model: random_forest
search_method: random  # grid | random
cv_method: TimeSeriesSplit
cv_splits: 3
scoring: accuracy
n_random_iter: 100

param_grid:
  n_estimators: [100, 200, 300, 500]
  max_depth: [6, 8, 10, 15]  # None not supported in YAML; use -1 to mean unlimited
  min_samples_split: [2, 5, 10]
  min_samples_leaf: [1, 3, 5, 10]
  max_features: ["sqrt", "log2"]

fixed_params:
  random_state: 42
  n_jobs: -1
