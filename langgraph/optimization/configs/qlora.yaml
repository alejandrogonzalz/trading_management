model: qlora
search_method: manual  # print configs for manual Unsloth training
scoring: accuracy

param_grid:
  learning_rate: [0.00001, 0.00002, 0.00005, 0.0001]
  lora_rank: [8, 16, 32]
  lora_alpha: [16, 32, 64]
  epochs: [1, 2, 3]
  batch_size: [4, 8]

# Recommended combos (subset to actually run)
recommended_configs:
  - {learning_rate: 0.00002, lora_rank: 16, lora_alpha: 32, epochs: 2, batch_size: 4}
  - {learning_rate: 0.00005, lora_rank: 8, lora_alpha: 16, epochs: 3, batch_size: 8}
  - {learning_rate: 0.00001, lora_rank: 32, lora_alpha: 64, epochs: 2, batch_size: 4}
  - {learning_rate: 0.0001, lora_rank: 16, lora_alpha: 32, epochs: 1, batch_size: 8}
  - {learning_rate: 0.00005, lora_rank: 16, lora_alpha: 32, epochs: 2, batch_size: 4}
