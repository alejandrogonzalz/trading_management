model: xgboost
search_method: random  # round 2: focused random search
cv_method: TimeSeriesSplit
cv_splits: 3
scoring: accuracy
n_random_iter: 80

param_grid:
  n_estimators: [200, 300, 500]
  max_depth: [3, 4, 5, 6]          # round 1 showed 4-6 wins; removed 8 and 10
  learning_rate: [0.01, 0.05, 0.1]
  subsample: [0.7, 0.8, 0.9]
  colsample_bytree: [0.7, 0.8, 0.9]
  reg_alpha: [0.0, 0.1, 0.5]       # L1 regularization — new in round 2
  reg_lambda: [1.0, 2.0, 5.0]      # L2 regularization — new in round 2

fixed_params:
  eval_metric: logloss
  random_state: 42
