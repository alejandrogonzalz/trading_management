line-length = 120
target-version = "py311"

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear (likely bugs)
    "UP",   # pyupgrade (modernize syntax)
    "N",    # pep8-naming
]
ignore = [
    "E501",  # line too long — handled by formatter
    "E402",  # module import not at top (cli.py needs sys.path.insert first)
    "E722",  # bare except — existing code, fix incrementally
    "B008",  # do not perform calls in default args (FastAPI depends on this)
    "B904",  # raise without from inside except — existing code
    "B905",  # zip() without strict= — stylistic, not a bug
    "N806",  # variable lowercase (ML code uses X, y)
    "N803",  # argument lowercase (same reason)
    "N815",  # mixedCase in class scope — existing code
    "F403",  # star import — existing code
    "F405",  # may be from star import — follows from F403
]

[lint.per-file-ignores]
"tests/**" = ["F401", "F811", "F841", "B007", "E741"]
"langgraph/optimization/**" = ["N802"]
"langgraph/backtest/evaluation/runner.py" = ["F841"]
"backend/app/**" = ["F841", "B007"]
# One-off maintenance scripts — not production code
"backend/check_trades.py" = ["W291", "W293"]
"backend/fix_pepe.py" = ["W291", "W293"]
"backend/scripts/**" = ["F841"]

[lint.isort]
known-first-party = ["app", "agent", "backtest", "optimization"]

[format]
quote-style = "double"
indent-style = "space"
